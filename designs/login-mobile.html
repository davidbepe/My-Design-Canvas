<!doctype html>
<html lang="id"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login - Mobile</title>
<link rel="stylesheet" href="tokens.css">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; }
  body { font-family: var(--font-sans, system-ui, sans-serif); color: var(--color-text, #111); }
</style>
</head>
<body style="display: flex; flex-direction: column; gap: 16px; min-height: 100vh;">
<style>
  body { background: var(--color-bg); }
  .screen { min-height: 100vh; display: flex; flex-direction: column; padding: 72px var(--space-6) var(--space-8); gap: var(--space-8); }
  .brand { width: 48px; height: 48px; border-radius: var(--radius-md); background: var(--color-primary); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: var(--text-lg); }
  .heading { display: flex; flex-direction: column; gap: var(--space-2); }
  .heading h1 { margin: 0; font-size: var(--text-xl); line-height: 1.2; color: var(--color-text); }
  .heading p { margin: 0; font-size: var(--text-base); color: var(--color-muted); line-height: 1.5; }
  .form { display: flex; flex-direction: column; gap: var(--space-4); }
  .field { display: flex; flex-direction: column; gap: var(--space-2); }
  .field label { font-size: var(--text-sm); font-weight: 600; color: var(--color-text); }
  .field input { height: 48px; padding: 0 var(--space-4); border: 1px solid var(--color-border); border-radius: var(--radius-md); font: inherit; font-size: var(--text-base); color: var(--color-text); background: var(--color-bg); }
  .forgot { align-self: flex-end; font-size: var(--text-sm); color: var(--color-accent); text-decoration: none; font-weight: 600; }
  .primary { height: 52px; border: 0; border-radius: var(--radius-md); background: var(--color-primary); color: #fff; font: inherit; font-size: var(--text-base); font-weight: 600; margin-top: var(--space-2); }
  .divider { display: flex; align-items: center; gap: var(--space-3); color: var(--color-muted); font-size: var(--text-sm); }
  .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--color-border); }
  .google { height: 52px; border: 1px solid var(--color-border); border-radius: var(--radius-md); background: var(--color-bg); font: inherit; font-size: var(--text-base); font-weight: 600; color: var(--color-text); display: flex; align-items: center; justify-content: center; gap: var(--space-2); }
  .signup { margin-top: auto; text-align: center; font-size: var(--text-sm); color: var(--color-muted); }
  .signup a { color: var(--color-text); font-weight: 600; text-decoration: none; }
</style>
<main class="screen">
  <div class="brand">D</div>
  <div class="heading">
    <h1>Selamat datang kembali</h1>
    <p>Masuk ke akunmu untuk melanjutkan.</p>
  </div>
  <form class="form">
    <div class="field">
      <label for="email">Email</label>
      <input id="email" type="email" placeholder="nama@email.com">
    </div>
    <div class="field">
      <label for="password">Kata sandi</label>
      <input id="password" type="password" placeholder="Masukkan kata sandi">
    </div>
    <a class="forgot" href="#">Lupa kata sandi?</a>
    <button class="primary" type="button">Masuk</button>
  </form>
  <div class="divider">atau</div>
  <button class="google" type="button">
    <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5a5.6 5.6 0 0 1-2.4 3.6v3h3.9c2.3-2.1 3.5-5.2 3.5-8.8z"></path><path fill="#34A853" d="M12 24c3.2 0 6-1.1 8-2.9l-3.9-3c-1.1.7-2.5 1.2-4.1 1.2-3.1 0-5.8-2.1-6.7-5H1.3v3.1A12 12 0 0 0 12 24z"></path><path fill="#FBBC05" d="M5.3 14.3a7.2 7.2 0 0 1 0-4.6V6.6H1.3a12 12 0 0 0 0 10.8l4-3.1z"></path><path fill="#EA4335" d="M12 4.8c1.8 0 3.3.6 4.6 1.8l3.4-3.4A12 12 0 0 0 1.3 6.6l4 3.1c.9-2.9 3.6-4.9 6.7-4.9z"></path></svg>
    Masuk dengan Google
  </button>
  <p class="signup">Belum punya akun? <a href="#">Daftar</a></p>
</main>





</body></html>
