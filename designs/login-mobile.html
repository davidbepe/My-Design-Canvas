<html lang="id"><head>

<title>Login - Mobile</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }

<body style="flex-direction: column;">

  body { background: #fafafa; display: flex; flex-direction: column; padding: 64px 24px; gap: 16px; height: 100vh; }
